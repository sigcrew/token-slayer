<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>크기 조절</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px 20px; background: #141626; color: #E8E8F0; font: 13px -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif; user-select: none; }
    .row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
    .row b { font-size: 14px; }
    #val { font: 600 20px ui-monospace, Menlo, monospace; color: #FFD166; }
    input[type=range] { width: 100%; height: 26px; accent-color: #FFD166; margin: 0; }
    .scale { position: relative; height: 14px; color: #8A8FA8; font-size: 11px; margin: 2px 2px 12px; }
    .scale span { position: absolute; top: 0; transform: translateX(-50%); }
    .btns { display: flex; gap: 8px; }
    button { flex: 1; padding: 7px 0; border: 1px solid #2C3150; border-radius: 6px; background: #1B1E33; color: #E8E8F0; font: inherit; cursor: pointer; }
    button:hover { background: #262A46; }
    p { margin: 12px 0 0; color: #8A8FA8; font-size: 11.5px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="row"><b>위젯 크기</b><span id="val">×1.00</span></div>
  <input id="slider" type="range" min="0.5" max="1.75" step="0.05" value="1" />
  <div class="scale"><span style="left:2%">0.5</span><span style="left:40%">보통 (1)</span><span style="left:98%">1.75</span></div>
  <div class="btns"><button id="reset">기본값 (×1)</button><button id="close">닫기</button></div>
  <p>위젯 위에서 <b>⌥(Option)+스크롤</b>로도 조절할 수 있어요.</p>
  <script src="i18n-en.js"></script>
  <script src="i18n.js"></script>
  <script src="dom-i18n.js"></script>
  <script src="scale.js"></script>
</body>
</html>
